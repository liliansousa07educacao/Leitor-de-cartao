<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados 8º A</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}
main{max-width:920px;margin:auto;padding:16px}
.card{background:white;border:1px solid #dfe4ec;border-radius:16px;padding:16px}
h1{font-size:23px;margin:0 0 6px}.sub{color:#5d6675;margin-bottom:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.stat{background:#eef4ff;border-radius:10px;padding:9px 12px;font-weight:750}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd3df;border-radius:10px;font-size:16px;margin-bottom:12px}
.wrap{overflow-x:auto;border:1px solid #e2e6ed;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:620px;background:white}
th,td{padding:10px 8px;border-bottom:1px solid #e7eaf0;text-align:center;font-size:14px}
th{background:#f0f4fa;position:sticky;top:0}th:nth-child(2),td:nth-child(2){text-align:left}
button,a.btn{display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:13px;border:0;border-radius:11px;text-align:center;text-decoration:none;font-weight:800;font-size:16px}
button{background:#1769e0;color:#fff}.btn{background:#edf3ff;color:#1459b8}
#msg{margin-top:8px;font-weight:650}.empty{padding:16px;text-align:center;color:#687386}
</style></head>
<body><main><div class="card">
<h1>Resultados — 8º A</h1><div class="sub">Tabela de notas salvas no leitor.</div>
<div class="stats"><div class="stat" id="done">Corrigidos: 0/40</div><div class="stat" id="left">Faltam: 40</div></div>
<input id="q" type="search" placeholder="Buscar aluno">
<div class="wrap"><table><thead><tr><th>Nº</th><th>Aluno</th><th>Ed. Física</th><th>Inglês</th><th>Português</th><th>Arte</th></tr></thead><tbody id="tb"></tbody></table></div>
<button id="csv">Baixar resultados (CSV)</button><div id="msg"></div>
<a class="btn" href="./index.html">Voltar ao leitor</a>
</div></main>
<script>
(function(){
 const STORE='leitor8A_resultados_etapa4b', TOTAL=40;
 const tb=document.getElementById('tb'), q=document.getElementById('q'), msg=document.getElementById('msg');
 function rows(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return[]}}
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function render(){
   const all=rows().sort((a,b)=>a.no-b.no), f=(q.value||'').toUpperCase();
   document.getElementById('done').textContent=`Corrigidos: ${all.length}/${TOTAL}`;
   document.getElementById('left').textContent=`Faltam: ${Math.max(0,TOTAL-all.length)}`;
   const show=all.filter(r=>!f||String(r.aluno).toUpperCase().includes(f));
   tb.innerHTML=show.length?show.map(r=>`<tr><td>${r.no}</td><td>${esc(r.aluno)}</td><td>${r.ef.nota}</td><td>${r.ingles.nota}</td><td>${r.portugues.nota}</td><td>${r.arte.nota}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum resultado encontrado.</td></tr>';
 }
 q.addEventListener('input',render);
 document.getElementById('csv').addEventListener('click',()=>{
   const all=rows().sort((a,b)=>a.no-b.no); if(!all.length){msg.textContent='Ainda não há resultados salvos.';return}
   const H=['Nº','Aluno','Acertos Ed. Física','Nota EF','Acertos Inglês','Nota Inglês','Acertos Português','Nota Português','Acertos Arte','Nota Arte'];
   const Q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
   const D=all.map(r=>[r.no,r.aluno,`${r.ef.acertos}/${r.ef.total}`,r.ef.nota,`${r.ingles.acertos}/${r.ingles.total}`,r.ingles.nota,`${r.portugues.acertos}/${r.portugues.total}`,r.portugues.nota,`${r.arte.acertos}/${r.arte.total}`,r.arte.nota]);
   const blob=new Blob(['\uFEFF'+[H,...D].map(x=>x.map(Q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
   const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Resultados_8A.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
   msg.textContent='Arquivo de resultados preparado.';
 });
 render();
})();
</script></body></html>
