<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Leitor de Cartão</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;color:#172033}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dbe2ec;border-radius:16px;padding:14px;margin-bottom:12px}h1{font-size:21px;margin:0 0 4px}.muted{color:#667085;font-size:13px}.viewer{position:relative;width:100%;height:min(68vh,680px);min-height:430px;background:#111;border-radius:14px;overflow:hidden;margin:12px 0}.viewer video,.viewer canvas{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.guide{position:absolute;left:5%;right:5%;top:8%;bottom:8%;border:3px solid #00e676;border-radius:10px;pointer-events:none}.guide span{position:absolute;top:-30px;left:0;right:0;color:#fff;text-align:center;font-weight:700;text-shadow:0 1px 3px #000;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .wide{grid-column:1/-1}button{border:0;border-radius:12px;padding:13px 10px;font:inherit;font-weight:750}.primary{background:#1265e8;color:#fff}.secondary{background:#e8f0ff;color:#184f9f}.status{padding:11px;border-radius:10px;background:#eef2f7;font-size:14px;margin-top:10px}.ok{background:#eaf8ee;color:#166534}.warn{background:#fff6df;color:#805500}.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.ans{border:1px solid #dde4ee;border-radius:9px;padding:8px 4px;text-align:center;font-size:13px}.ans b{font-size:15px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.scorebox{border:1px solid #dde4ee;border-radius:12px;padding:11px}.scorebox b{display:block;font-size:15px}.scorebox .note{font-size:22px;font-weight:800;margin-top:3px}.hidden{display:none!important}@media(max-width:480px){.wrap{padding:8px}.scoregrid{grid-template-columns:1fr 1fr}.viewer{height:64vh;min-height:390px}.answers{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div class="wrap"><div class="card">
  <label for="studentSearch"><b>Aluno — 8º A</b></label>
  <input id="studentSearch" list="studentOptions" placeholder="Digite as primeiras letras do nome" autocomplete="off">
  <datalist id="studentOptions"></datalist>
  <div id="selectedStudent" class="muted" style="margin-top:8px">Nenhum aluno selecionado.</div>
</div>
<div class="card"><h1>Leitor de Cartão-Resposta</h1><div class="muted">Base do leitor • 30 questões A/B/C/D</div><div class="viewer" id="viewer"><video id="video" autoplay playsinline></video><canvas id="canvas" class="hidden"></canvas><div class="guide" id="guide"><span>Enquadre o cartão inteiro</span></div></div><div class="actions"><button class="primary" id="camera">Abrir câmera</button><button class="secondary" id="photo">Escolher foto</button><button class="primary wide" id="read" disabled>Ler cartão</button><button class="secondary wide hidden" id="again">Nova leitura</button></div><input id="file" type="file" accept="image/*" capture="environment" class="hidden"><div id="status" class="status">Abra a câmera ou escolha uma foto.</div></div><div class="card hidden" id="result"><b>Respostas detectadas</b><div class="answers" id="answers" style="margin-top:10px"></div></div><div class="card hidden" id="scores"><b>Resultado pelo gabarito — 8º A • Arte Visuais</b><div class="muted" style="margin:4px 0 10px">Notas calculadas somente após a leitura 30/30.</div><div class="scoregrid" id="scoreGrid"></div></div></div><script>
// ETAPA 2: pesquisa de aluno. O motor 30/30 abaixo permanece intacto.
const roster8A = [
'ADRIAN RAFAEL PANTOJA ALVES','ALYSSON GABRIEL FERREIRA','ANNA CLARA MARTINS MONTALVÃO','ANNA JULIA BEZERRA LOPIS','CARLOS EDUARDO LOPES SANTOS','DAVI ALVES BISPO','DAVI DE SOUZA LIMA','DAVI PACHECO GONÇALVES','EDUARDA ARAÚJO BEZERRA','EDUARDO GONZAGA FERREIRA','EDUARDO PINHEIRO PONTES','ELIZABETH VITÓRIA SOARES DOS SANTOS','GABRIEL MACEDO DA SILVA','GERINDAVI GOMES DE SOUSA','GUSTAVO NOGUEIRA FREIRE','HAILLEANDRO BATISTA DOS SANTOS','HEITOR GONÇALVES INÁCIO','ISADORA COSTA RIBEIRO','JOÃO VITOR ALVES BORGES','JOHN CABRAL GUIMARÃES','JORDAN PACHECO MOTA','JULHIA RODRIGUES PEREIRA','LAURA NUNES BATISTA','LUCAS GABRIEL SILVA DE SOUSA','MARCOS KAUÃ RIBEIRO LISBOA','MARIA CLARA ALVES BORGES SILVA','MARYANA SOPHIA VASCONCELOS VIEIRA','MATEUS GABRIEL INÁCIO ALVES','MATHEUS OLIVEIRA MONTALVÃO','MILO EDWARD QUISPE DORI','NICOLAS DOURADO MACHADO','PEDRO ELEUTERIO DE OLIVEIRA','RAFAEL GOMES C. DE SOUSA','RAFAEL SOLDAGA GUIRRA SCALZITTI','ROBERTA SILVA MARQUES','SOPHIA DE FREITAS CABRAL','SUELLEN CRISTINA SANTOS SILVA','VICTOR MIGUEL SIMÕES','TALLYTA MAURIZ SOUZA','MIGUEL JOSÉ RIBEIRO SANTOS'];
const studentSearch=document.getElementById('studentSearch');
const studentOptions=document.getElementById('studentOptions');
const selectedStudent=document.getElementById('selectedStudent');
studentOptions.innerHTML=roster8A.map((n,i)=>`<option value="${n}">${i+1}. ${n}</option>`).join('');
function normStudent(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function showStudent(){
 const i=roster8A.findIndex(n=>normStudent(n)===normStudent(studentSearch.value));
 selectedStudent.textContent=i>=0?`${i+1}. ${roster8A[i]} — selecionado`:(studentSearch.value.trim()?'Continue digitando e escolha uma opção.':'Nenhum aluno selecionado.');
}
studentSearch.addEventListener('input',showStudent);
studentSearch.addEventListener('change',showStudent);


// ETAPA 3: gabarito e notas. As ETAPAS 1 e 2 acima ficam congeladas.
const key8Visual=['C','A','D','B','B','C','D','A','B','C','C','A','C','D','D','D','A','C','B','B','D','D','A','A','B','A','D','B','D','D'];
function calcScores(a){
 const parts=[
  {name:'Educação Física',start:0,end:5,total:5},
  {name:'Língua Inglesa',start:5,end:10,total:5},
  {name:'Língua Portuguesa',start:10,end:25,total:15},
  {name:'Arte (Visuais)',start:25,end:30,total:5}
 ];
 const grid=document.getElementById('scoreGrid');
 grid.innerHTML=parts.map(p=>{let hits=0;for(let i=p.start;i<p.end;i++)if(a[i]===key8Visual[i])hits++;let grade=(hits/p.total*10).toFixed(1).replace('.',',');return `<div class="scorebox"><b>${p.name}</b><div>${hits}/${p.total} acertos</div><div class="note">Nota ${grade}</div></div>`}).join('');
 document.getElementById('scores').classList.remove('hidden');
}
const $=id=>document.getElementById(id), video=$('video'),canvas=$('canvas'),guide=$('guide'),statusEl=$('status');let stream=null;
function status(t,c=''){statusEl.className='status '+c;statusEl.innerHTML=t}
$('camera').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:2560}},audio:false});video.srcObject=stream;$('read').disabled=false;status('Câmera aberta. Deixe o cartão inteiro visível e toque em <b>Ler cartão</b>.','ok')}catch(e){status('Não consegui abrir a câmera. Permita o acesso ou use <b>Escolher foto</b>.','warn')}};
$('photo').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let img=await load(f);draw(img);analyze()};
$('read').onclick=()=>{if(!video.videoWidth)return status('Aguarde a câmera carregar.','warn');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);showCanvas();analyze()};
$('again').onclick=()=>{canvas.classList.add('hidden');video.classList.remove('hidden');guide.classList.remove('hidden');$('again').classList.add('hidden');$('result').classList.add('hidden');$('scores').classList.add('hidden');status('Faça uma nova leitura.','')};
function load(f){return new Promise((res,rej)=>{let u=URL.createObjectURL(f),i=new Image;i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
function draw(img){let max=1200,s=Math.min(1,max/img.width);canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);showCanvas()}
function showCanvas(){canvas.classList.remove('hidden');video.classList.add('hidden');guide.classList.add('hidden');$('again').classList.remove('hidden')}
function analyze(){let r=detectMarks();if(!r){$('result').classList.add('hidden');return status('Ainda não localizei as 30 marcações. Mantenha o cartão inteiro na imagem.','warn')}render(r.answers);calcScores(r.answers);status(`Cartão reconhecido: <b>30/30 respostas</b>${r.uncertain.length?`. ${r.uncertain.length} para conferir.`:'.'}`,'ok')}
function detectMarks(){const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,d=ctx.getImageData(0,0,w,h).data,N=w*h,mask=new Uint8Array(N);
 for(let p=0,i=0;p<N;p++,i+=4){let r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g),mn=Math.min(r,g,b),M=Math.max(r,g,b);if(b>45&&r<205&&g<205&&(b-mx)>6&&((b+r*.25)-g)>22&&(M-mn)>18)mask[p]=1}
 const seen=new Uint8Array(N), comps=[], stack=[];let minA=Math.max(10,Math.floor(N*.000012)),maxA=Math.floor(N*.008);
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let p=y*w+x;if(!mask[p]||seen[p])continue;let n=0,sx=0,sy=0,minx=x,maxx=x,miny=y,maxy=y;seen[p]=1;stack.push(p);while(stack.length){let q=stack.pop(),qy=(q/w)|0,qx=q-qy*w;n++;sx+=qx;sy+=qy;if(qx<minx)minx=qx;if(qx>maxx)maxx=qx;if(qy<miny)miny=qy;if(qy>maxy)maxy=qy;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;let nx=qx+dx,ny=qy+dy;if(nx>0&&nx<w-1&&ny>0&&ny<h-1){let np=ny*w+nx;if(mask[np]&&!seen[np]){seen[np]=1;stack.push(np)}}}}let bw=maxx-minx+1,bh=maxy-miny+1;if(n>=minA&&n<=maxA&&bw>4&&bh>4&&bw<w*.08&&bh<h*.05)comps.push({x:sx/n,y:sy/n,area:n,bw,bh})}
 let pts=comps.filter(c=>c.y>h*.05&&c.y<h*.9&&c.x>w*.04&&c.x<w*.96);if(pts.length<28)return null;
 // procura duas faixas horizontais de respostas pela distribuição X
 let xs=pts.map(p=>p.x).sort((a,b)=>a-b),bestGap=-1,cut=w/2;for(let i=0;i<xs.length-1;i++){let g=xs[i+1]-xs[i];if(xs[i]>w*.15&&xs[i+1]<w*.85&&g>bestGap){bestGap=g;cut=(xs[i]+xs[i+1])/2}}
 let L=selectRows(pts.filter(p=>p.x<cut),h),R=selectRows(pts.filter(p=>p.x>=cut),h);if(L.length!==15||R.length!==15)return null;
 let dl=decode(L,0),dr=decode(R,15);if(!dl||!dr)return null;return{answers:dl.a.concat(dr.a),uncertain:dl.u.concat(dr.u)}
}
function selectRows(side,h){side=side.slice().sort((a,b)=>a.y-b.y);let gs=[];for(let p of side){let g=gs.find(z=>Math.abs(z.y-p.y)<h*.012);if(!g){g={y:p.y,pts:[]};gs.push(g)}g.pts.push(p);g.y=g.pts.reduce((s,q)=>s+q.y,0)/g.pts.length}gs.sort((a,b)=>a.y-b.y);if(gs.length<15)return[];let best=[],score=1e99;for(let i=0;i<=gs.length-15;i++){let a=gs.slice(i,i+15),ds=[];for(let j=1;j<15;j++)ds.push(a[j].y-a[j-1].y);let m=ds.reduce((s,v)=>s+v,0)/14,sc=ds.reduce((s,v)=>s+(v-m)**2,0)/14;if(m>h*.012&&sc<score){score=sc;best=a}}return best}
function decode(groups,off){let marks=groups.map(g=>g.pts.sort((a,b)=>b.area-a.area)[0]),xs=marks.map(p=>p.x).sort((a,b)=>a-b);let lo=xs[0],hi=xs[xs.length-1],span=hi-lo;if(span<10)return null;let step=span/3,base=lo; // refine using candidate lattice
 let best={e:1e99,b:base,s:step};for(let s=step*.72;s<=step*1.28;s+=step*.02){for(let b=lo-s*.25;b<=lo+s*.25;b+=Math.max(1,s*.03)){let e=0;for(let x of xs){let k=Math.max(0,Math.min(3,Math.round((x-b)/s)));e+=(x-(b+k*s))**2}if(e<best.e)best={e,b,s}}}base=best.b;step=best.s;let a=[],u=[],letters='ABCD';marks.forEach((p,i)=>{let k=Math.max(0,Math.min(3,Math.round((p.x-base)/step))),err=Math.abs(p.x-(base+k*step));a.push(letters[k]);if(err>step*.38)u.push(off+i+1)});return{a,u}}
function render(a){$('answers').innerHTML=a.map((v,i)=>`<div class="ans">${i+1}<br><b>${v}</b></div>`).join('');$('result').classList.remove('hidden')}
</script></body></html>
